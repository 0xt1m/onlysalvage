# nginx reverse proxy for OnlySalvage -- routes /api/ and /admin/ to the
# Django gunicorn socket, everything else to the Next.js frontend on :3000.
# Install at /etc/nginx/sites-available/onlysalvage.conf, symlink into
# sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# TLS cert paths below are placeholders -- run certbot AFTER DNS for your
# real domain points at this instance's IP:
#   sudo certbot --nginx -d onlysalvage.com -d www.onlysalvage.com
# certbot rewrites this file's ssl_certificate lines itself; you don't need
# to fill them in by hand first, just get the http (port 80) block working
# and pointed at the right domain, then run certbot.

upstream onlysalvage_api {
    server unix:/run/onlysalvage/api.sock;
}

upstream onlysalvage_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name onlysalvage.com www.onlysalvage.com;

    # certbot needs plain HTTP access to this path for the initial cert
    # issuance/renewal challenge -- keep this before any redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name onlysalvage.com www.onlysalvage.com;

    # Filled in by certbot -- see the comment at the top of this file.
    ssl_certificate     /etc/letsencrypt/live/onlysalvage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onlysalvage.com/privkey.pem;

    client_max_body_size 15M;  # headroom above the 10MB photo-upload cap (see inventory/api/views.py)

    location /api/ {
        proxy_pass http://onlysalvage_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://onlysalvage_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://onlysalvage_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js dev-mode HMR isn't relevant in prod, but keep upgrade
        # headers anyway in case any route ends up using websockets later.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
